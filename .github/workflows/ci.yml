name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test PowerShell and profile files
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Test fresh-system Windows PowerShell compatibility
        shell: powershell
        run: ./scripts/test-windows-powershell.ps1
