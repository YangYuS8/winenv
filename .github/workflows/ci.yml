name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      base: ${{ steps.changes.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: node scripts/classify-changes.mjs

  docs:
    needs: changes
    runs-on: ubuntu-latest
    env:
      DOCS_DIFF_BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm test:docs
      - run: pnpm docs:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm docs:test
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-browser-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test PowerShell and profile files
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Test fresh-system Windows PowerShell compatibility
        shell: powershell
        run: ./scripts/test-windows-powershell.ps1
