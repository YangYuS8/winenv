name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Build documentation
        run: npm run docs:build

      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Test fresh-system Windows PowerShell compatibility
        shell: powershell
        run: ./scripts/test-windows-powershell.ps1

      - name: Release from commit history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Detect a newly published release
        id: published
        shell: pwsh
        run: |
          $releaseTags = @(git tag --points-at HEAD --list "v*")
          $gitExitCode = $LASTEXITCODE
          if ($gitExitCode -ne 0) {
              throw "Unable to inspect release tags."
          }
          $releaseTag = $releaseTags | Select-Object -First 1

          $wasPublished = -not [string]::IsNullOrWhiteSpace($releaseTag)
          "value=$($wasPublished.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($wasPublished) {
              Write-Host "Published release $releaseTag; installation smoke test will run."
          } else {
              Write-Host "No release was published; installation smoke test will be skipped."
          }

      - name: Install the newly published release
        if: steps.published.outputs.value == 'true'
        shell: pwsh
        run: ./scripts/smoke-install.ps1
