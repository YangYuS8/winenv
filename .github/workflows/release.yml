name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Release from commit history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Detect a newly published release
        id: published
        shell: pwsh
        run: |
          $releaseTag = git tag --points-at HEAD --list "v*" | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect release tags."
          }

          $wasPublished = -not [string]::IsNullOrWhiteSpace($releaseTag)
          "value=$($wasPublished.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($wasPublished) {
              Write-Host "Published release $releaseTag; installation smoke test will run."
          } else {
              Write-Host "No release was published; installation smoke test will be skipped."
          }

      - name: Install the newly published release
        if: steps.published.outputs.value == 'true'
        shell: pwsh
        run: ./scripts/smoke-install.ps1
