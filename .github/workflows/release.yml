name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Classify changes
        id: changes
        run: node scripts/classify-changes.mjs

      - name: Test documentation checks
        run: pnpm test:docs

      - name: Build documentation
        env:
          DOCS_DIFF_BASE: ${{ steps.changes.outputs.base }}
        run: pnpm docs:build

      - name: Test
        if: steps.changes.outputs.runtime == 'true'
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Test fresh-system Windows PowerShell compatibility
        if: steps.changes.outputs.runtime == 'true'
        shell: powershell
        run: ./scripts/test-windows-powershell.ps1

      - name: Release from commit history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

      - name: Detect a newly published release
        id: published
        shell: pwsh
        run: |
          $releaseTags = @(git tag --points-at HEAD --list "v*")
          $gitExitCode = $LASTEXITCODE
          if ($gitExitCode -ne 0) {
              throw "Unable to inspect release tags."
          }
          $releaseTag = $releaseTags | Select-Object -First 1

          $wasPublished = -not [string]::IsNullOrWhiteSpace($releaseTag)
          "value=$($wasPublished.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($wasPublished) {
              Write-Host "Published release $releaseTag; installation smoke test will run."
          } else {
              Write-Host "No release was published; installation smoke test will be skipped."
          }

      - name: Install the newly published release
        if: steps.published.outputs.value == 'true'
        shell: pwsh
        run: ./scripts/smoke-install.ps1

      - name: Record the validated documentation revision
        run: node scripts/record-docs-source.mjs

      - name: Pass the exact source revision to Pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-source
          path: ${{ runner.temp }}/docs-source.json
          if-no-files-found: error
          retention-days: 7
