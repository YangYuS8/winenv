name: Set up documentation toolchain
description: Use the single pinned Node and pnpm versions for docs and releases.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      env:
        # Only the action's isolated npm bootstrap: avoid an implicit advisory
        # request blocking setup for five minutes. Keep project checks below.
        npm_config_audit: 'false'
      with:
        run_install: false
        cache: true
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Verify registry signatures
      shell: bash
      run: pnpm audit signatures
